<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="./detalle.html">Volver al taller</a>
  </header>
  <main>
    <h1>Registar asistencia</h1>
    <form class="formulario-registro" id="form-registro" novalidate>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>
      <span class="error" id="error-nombre">
      </span>

      <label for="boleta">Numero de boleta</label>
      <input type="text" id="boleta" name="boleta"required>
      <span class="error" id="error-boleta">
      </span>

      <label class="Fecha">Fecha de Registro(DD/MM/AAAA)</label>
      <input type="text" id="fecha" name="fecha"required>
      <span class="error" id="error-fecha">
      </span>

      <button type="submit">Registrar</button>
      <p class="mensaje-exito" id="mensaje-exito"></p>
    </form>
  </main>
  <script src="./js/validaciones.js"></script>
</body>
</html>
